[project]
name = "ow-scores-classic"
version = "0.1.0"
description = "Open Wearables native Sleep Score and Resilience Score, vendored from the last MIT release"
requires-python = ">=3.14"
license = "MIT"
# Core is provided by the image this is installed into; `requires_core` on the
# extension is the compatibility contract, not a package dependency.
dependencies = []

[project.entry-points."open_wearables.extensions"]
ow_scores_classic = "ow_scores_classic.extension:OwScoresClassicExtension"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ow_scores_classic"]
